name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  release-identity:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Unsupported release tag: ${tag}"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  native-tests:
    name: Native tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Add MinGW toolchain to PATH
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:USERPROFILE ".platformio\packages\toolchain-gccmingw32\bin"
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run native tests
        run: pio test -e native

  build-release:
    name: Build Cardputer flash package
    needs: release-identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Build Cardputer firmware
        env:
          PLATFORMIO_BUILD_FLAGS: '-DLUMA_VERSION=\"${{ needs.release-identity.outputs.version }}\"'
        run: pio run -e m5stack-cardputer

      - name: Build LittleFS image
        env:
          PLATFORMIO_BUILD_FLAGS: '-DLUMA_VERSION=\"${{ needs.release-identity.outputs.version }}\"'
        run: pio run -e m5stack-cardputer --target buildfs

      - name: Package Cardputer flash assets
        run: |
          bash tools/package-cardputer-flash.sh \
            --build-dir .pio/build/m5stack-cardputer \
            --identity "${{ needs.release-identity.outputs.version }}" \
            --slug "${{ needs.release-identity.outputs.tag }}" \
            --output-dir cardputer-flash

      - name: Upload Cardputer flash package
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-flash
          path: cardputer-flash/*
          if-no-files-found: error
          retention-days: 7

  sdl-preview:
    needs: release-identity
    uses: ./.github/workflows/sdl-preview.yml
    with:
      luma-version: ${{ needs.release-identity.outputs.version }}
      file-slug: ${{ needs.release-identity.outputs.tag }}

  release:
    name: Create GitHub Release
    needs:
      - native-tests
      - build-release
      - sdl-preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: collected

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          cp collected/cardputer-flash/luma-cardputer-${tag}-merged.bin release-assets/
          cp collected/cardputer-flash/luma-cardputer-${tag}-flash.zip release-assets/
          cp collected/sdl-preview-windows-x64/luma-sdl-preview-${tag}-windows-x64.zip release-assets/
          cp collected/sdl-preview-macos-arm64/luma-sdl-preview-${tag}-macos-arm64.zip release-assets/
          cp collected/sdl-preview-macos-x64/luma-sdl-preview-${tag}-macos-x64.zip release-assets/
          cp collected/sdl-preview-linux-x64/luma-sdl-preview-${tag}-linux-x64.zip release-assets/

          cd release-assets
          sha256sum --check ../collected/cardputer-flash/SHA256SUMS
          unzip -t "luma-cardputer-${tag}-flash.zip"
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_flags=(
            --verify-tag
            --generate-notes
            --title "Luma ${RELEASE_TAG}"
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create \
            "${RELEASE_TAG}" \
            release-assets/* \
            "${release_flags[@]}"
