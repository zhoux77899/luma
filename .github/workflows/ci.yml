name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  identity:
    name: Build identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      slug: ${{ steps.resolve.outputs.slug }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve build identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          default_version="$(sed -n 's/^#define LUMA_VERSION "\([^"]*\)"/\1/p' include/luma/version.h | head -n 1)"
          test -n "${default_version}"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          identity="${default_version}+g${short_sha}"
          slug="${default_version}-g${short_sha}"
          echo "version=${identity}" >> "${GITHUB_OUTPUT}"
          echo "slug=${slug}" >> "${GITHUB_OUTPUT}"

  native-tests:
    name: Native tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Add MinGW toolchain to PATH
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:USERPROFILE ".platformio\packages\toolchain-gccmingw32\bin"
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run native tests
        run: pio test -e native

  firmware-build:
    name: Cardputer flash package
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Build Cardputer firmware
        env:
          PLATFORMIO_BUILD_FLAGS: '-DLUMA_VERSION=\"${{ needs.identity.outputs.version }}\"'
        run: pio run -e m5stack-cardputer

      - name: Build LittleFS image
        env:
          PLATFORMIO_BUILD_FLAGS: '-DLUMA_VERSION=\"${{ needs.identity.outputs.version }}\"'
        run: pio run -e m5stack-cardputer --target buildfs

      - name: Package Cardputer flash assets
        run: |
          bash tools/package-cardputer-flash.sh \
            --build-dir .pio/build/m5stack-cardputer \
            --identity "${{ needs.identity.outputs.version }}" \
            --slug "${{ needs.identity.outputs.slug }}" \
            --output-dir cardputer-flash

      - name: Upload Cardputer flash package
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-flash
          path: cardputer-flash/*
          if-no-files-found: error
          retention-days: 14

  sdl-preview:
    needs: identity
    uses: ./.github/workflows/sdl-preview.yml
    with:
      luma-version: ${{ needs.identity.outputs.version }}
      file-slug: ${{ needs.identity.outputs.slug }}
