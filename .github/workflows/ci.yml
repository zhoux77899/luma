name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.19"
  PYTHON_VERSION: "3.11"

jobs:
  native-tests:
    name: Native tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install "platformio==${{ env.PLATFORMIO_VERSION }}"

      - name: Add MinGW toolchain to PATH
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:USERPROFILE ".platformio\packages\toolchain-gccmingw32\bin"
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run native tests
        run: pio test -e native

  firmware-build:
    name: Cardputer firmware build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install "platformio==${{ env.PLATFORMIO_VERSION }}"

      - name: Build Cardputer firmware
        run: pio run -e m5stack-cardputer
